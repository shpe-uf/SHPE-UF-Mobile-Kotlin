# Used by the admin Event Info page. Grabs every event plus who attended,
# so the table and the Manual Input / Info popups all work off one request.
query EventInfoTable {
    getEvents {
        id
        name
        code
        category
        points
        attendance
        expiration
        request
        semester
        createdAt
        users {
            username
            firstName
            lastName
        }
    }
}
